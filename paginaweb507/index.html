<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cafetería Escolar</title>
</head>

<body>

<header>
    <div class="titulo"> 
        <img src="cafeteria.jpg" alt="Cafetería">
        <div>
            <h1>Cafetería Escolar</h1>
            <p>Alimentos y bebidas para estudiantes</p>
        </div>
    </div>
</header>

<nav>
    <a href="#menu">Menú</a> |
    <a href="#contacto">Contacto</a>
</nav>

<main>

    <section id="menu">
        <h2>Menú</h2>

        <table border="1">
            <tr><th>Producto</th><th>Precio</th></tr>
            <tr><td>Hamburguesa</td><td>$45</td></tr>
            <tr><td>Jugo</td><td>$20</td></tr>
            <tr><td>Sándwich</td><td>$30</td></tr>
        </table>
    </section>

    <section id="contacto">
        <h2>Contacto</h2>
        <form>
            <label>Nombre:</label>
            <input type="text"><br><br>

            <label>Correo:</label>
            <input type="email"><br><br>

            <label>Mensaje:</label>
            <textarea></textarea><br><br>

            <button type="submit">Enviar</button>
        </form>
    </section>

</main>

<footer>
    <p>Cafetería Escolar © 2026</p>
</footer>

</body>
</html>
